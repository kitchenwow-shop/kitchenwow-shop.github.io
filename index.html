<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen Wow – Viral kitchen gadgets that actually work</title>
<meta name="description" content="Smart, affordable kitchen gadgets from our videos. Find every product by its number.">
<link rel="icon" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta property="og:title" content="Kitchen Wow 🍳">
<meta property="og:description" content="Viral kitchen gadgets that actually work. Find every product from our videos here.">
<meta property="og:image" content="images/logo.png">
<style>
  :root{
    --yellow:#FFD84D; --yellow-soft:#FFF4C7; --red:#E63946; --ink:#2B2B2B; --muted:#6B6B6B;
    --card:#FFFFFF; --radius:22px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--yellow); color:var(--ink); min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px;margin:0 auto;padding:28px 18px 40px}
  header{text-align:center;margin-bottom:22px}
  .logo{width:112px;height:112px;border-radius:50%;border:5px solid #fff;box-shadow:0 6px 20px rgba(0,0,0,.12);display:block;margin:0 auto 12px}
  h1{font-size:30px;font-weight:800;letter-spacing:.3px}
  h1 span{color:var(--red)}
  .tag{font-size:15px;color:#4a4a4a;margin-top:4px}
  .socials{display:flex;justify-content:center;gap:10px;margin-top:14px}
  .socials a{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--ink);text-decoration:none;font-weight:600;font-size:13px;padding:8px 14px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .socials svg{width:16px;height:16px}

  .search{position:relative;display:block;margin:18px 0 8px}
  .search input{width:100%;border:none;border-radius:999px;padding:14px 18px 14px 46px;font:inherit;font-size:15px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.08);outline:none}
  .search input:focus{box-shadow:0 0 0 3px rgba(230,57,70,.35)}
  .search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
  .hint{font-size:13px;text-align:center;color:#5a4d14;margin:4px 0 16px}

  .grid{display:grid;gap:16px}
  .card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.08);display:grid;grid-template-columns:128px 1fr;align-items:stretch;transition:transform .15s}
  .card:active{transform:scale(.99)}
  .thumb{position:relative;background:var(--yellow-soft)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;aspect-ratio:1/1}
  .num{position:absolute;top:8px;left:8px;background:var(--red);color:#fff;font-weight:800;font-size:14px;padding:4px 10px;border-radius:999px}
  .new{position:absolute;bottom:8px;left:8px;background:var(--ink);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;letter-spacing:.5px}
  .info{padding:14px 14px 14px 16px;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
  .info h2{font-size:17px;line-height:1.25;font-weight:700}
  .info p{font-size:13px;color:var(--muted);line-height:1.4;margin-top:4px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--red);color:#fff;text-decoration:none;font-weight:700;font-size:14px;padding:11px 14px;border-radius:14px;box-shadow:0 4px 0 #b52a35}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #b52a35}
  .empty{display:none;text-align:center;background:#fff;border-radius:var(--radius);padding:22px;font-size:14px;color:var(--muted)}

  footer{margin-top:28px;text-align:center;font-size:12px;color:#5a4d14;line-height:1.6}
  footer strong{color:var(--ink)}
  @media (min-width:480px){ .card{grid-template-columns:150px 1fr} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="images/logo.png" alt="Kitchen Wow logo">
    <h1>Kitchen <span>Wow!</span></h1>
    <p class="tag">Viral kitchen gadgets that actually work ✨</p>
    <div class="socials">
      <a href="https://www.instagram.com/kitchenwow.shop" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>
        Instagram</a>
    </div>
  </header>

  <label class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" inputmode="search" placeholder="Search a product or its number, e.g. 1" autocomplete="off">
  </label>
  <p class="hint">Saw it in a video? Find it by its <strong>#number</strong> 👇</p>

  <main class="grid" id="list"></main>
  <div class="empty" id="empty">No product found 🤔 Try another number or word.</div>

  <footer>
    <p>© Kitchen Wow</p>
  </footer>
</div>

<script>
/* ===== ADD NEW PRODUCTS HERE =====
   Newest first. Copy one block, change the values, and save. */
const PRODUCTS = [
  {
    num: 4,
    name: "Stand Mixer with 3 Attachments",
    desc: "6 speeds, 3.8QT stainless steel bowl, dough hook, beater & whisk. Cream or pink.",
    image: "images/stand-mixer.jpg",
    link: "https://s.click.aliexpress.com/e/_c4dnaLVP",
    isNew: true
  },
  {
    num: 3,
    name: "Sliding Wall Hook Rail",
    desc: "Hang utensils, towels, bags & keys on one sleek rail. Slide the hooks wherever you need them.",
    image: "images/hook-rail.jpg",
    link: "https://s.click.aliexpress.com/e/_c4dF1PSp",
    isNew: false
  },
  {
    num: 2,
    name: "14-in-1 Vegetable Chopper",
    desc: "Dice, slice, grate & shred in seconds. Perfect cubes with one press. 14 blades in one box.",
    image: "images/vegetable-chopper.jpg",
    link: "https://s.click.aliexpress.com/e/_c3kDUFXT",
    isNew: false
  },
  {
    num: 1,
    name: "Oil Sprayer for Cooking",
    desc: "Fine mist for air fryer, salads & BBQ. Less oil, healthier food. 200 / 300 / 500 ml.",
    image: "images/oil-sprayer.jpg",
    link: "https://s.click.aliexpress.com/e/_c2xQTxN1",
    isNew: false
  },
];

const list = document.getElementById('list');
const empty = document.getElementById('empty');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function render(items){
  list.innerHTML = items.map(p => `
    <article class="card" id="p${p.num}">
      <div class="thumb">
        <img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy">
        <span class="num">#${p.num}</span>
        ${p.isNew ? '<span class="new">NEW</span>' : ''}
      </div>
      <div class="info">
        <div>
          <h2>${esc(p.name)}</h2>
          <p>${esc(p.desc)}</p>
        </div>
        <a class="btn" href="${esc(p.link)}" target="_blank" rel="sponsored nofollow noopener">Shop now →</a>
      </div>
    </article>`).join('');
  empty.style.display = items.length ? 'none' : 'block';
}

const sorted = [...PRODUCTS].sort((a,b) => b.num - a.num);
render(sorted);

document.getElementById('q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase().replace('#','');
  if(!q){ render(sorted); return; }
  render(sorted.filter(p => String(p.num) === q || (p.name + ' ' + p.desc).toLowerCase().includes(q)));
});

// Open straight to a product with ?p=3 or #3
const want = new URLSearchParams(location.search).get('p') || location.hash.replace('#','');
if(want){ const el = document.getElementById('p' + want); if(el) el.scrollIntoView({behavior:'smooth', block:'center'}); }
</script>
</body>
</html>
