const list = document.getElementById('list');
const empty = document.getElementById('empty');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function render(items){
  list.innerHTML = items.map(p => `
    <article class="card" id="p${p.num}">
      <div class="thumb">
        <img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy">
        <span class="num">#${p.num}</span>
        ${p.isNew ? '<span class="new">NEW</span>' : ''}
      </div>
      <div class="info">
        <h2>${esc(p.name)}</h2>
        <div class="actions">
          <a class="btn" href="${esc(p.link)}" target="_blank" rel="sponsored nofollow noopener">Shop</a>
        </div>
      </div>
    </article>`).join('');
  empty.style.display = items.length ? 'none' : 'block';
}

const sorted = [...PRODUCTS].sort((a,b) => b.num - a.num);
render(sorted);

document.getElementById('q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase().replace('#','');
  if(!q){ render(sorted); return; }
  render(sorted.filter(p => String(p.num) === q || (p.name + ' ' + p.desc).toLowerCase().includes(q)));
});

// Open straight to a product with ?p=3 or #3
